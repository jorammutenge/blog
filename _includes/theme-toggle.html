<script>
  // Light/dark mode. The site follows the system setting until the visitor
  // clicks the toggle; that choice is remembered in this browser. Switching
  // back to the system's own mode forgets the choice (follows the system again).
  (function () {
    var KEY = "theme";
    var root = document.documentElement;
    var systemDark = window.matchMedia("(prefers-color-scheme: dark)");

    function saved() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
    function save(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) {} }
    function system() { return systemDark.matches ? "dark" : "light"; }
    function current() { return root.getAttribute("data-theme") || system(); }

    function apply(theme) {
      if (theme) root.setAttribute("data-theme", theme);
      else root.removeAttribute("data-theme");
    }

    // Run before the page is drawn so a saved choice never flashes the wrong colours.
    apply(saved());

    document.addEventListener("DOMContentLoaded", function () {
      var button = document.createElement("button");
      button.type = "button";
      button.className = "theme-toggle";
      button.innerHTML =
        // Moon: shown in light mode (click for dark)
        '<svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>' +
        // Sun: shown in dark mode (click for light)
        '<svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/>' +
        '<path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

      function label() {
        var next = current() === "dark" ? "light" : "dark";
        button.setAttribute("aria-label", "Switch to " + next + " mode");
        button.title = "Switch to " + next + " mode";
      }

      button.addEventListener("click", function () {
        var next = current() === "dark" ? "light" : "dark";
        if (next === system()) { save(null); apply(null); }   // back to following the system
        else { save(next); apply(next); }
        label();
      });

      // If the system mode changes while no choice is saved, the CSS follows it;
      // just keep the button's label in sync.
      systemDark.addEventListener("change", label);

      label();
      var tools = document.querySelector(".site-tools");
      if (tools) tools.insertBefore(button, tools.firstChild);
      else document.body.appendChild(button);
    });
  })();
</script>
