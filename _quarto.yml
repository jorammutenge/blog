project:
  type: website
  output-dir: docs   # GitHub Pages serves main/docs
  resources:
    - fonts/*.woff2

website:
  title: "Joram Mutenge"
  site-url: "https://www.jorammutenge.com"
  description: "Writing by Joram Mutenge."
  llms-txt: true   # writes llms.txt for AI tools
  google-analytics:
    tracking-id: "G-5Y1ZXKXMBX"
    anonymize-ip: true
  favicon: images/favicon.png
  search:
    type: overlay   # magnifying glass that opens a search panel

format:
  html:
    theme: [default, styles.scss]
    page-layout: article
    lang: en
    smooth-scroll: true
    toc: false
    anchor-sections: false
    include-in-header: _includes/theme-toggle.html
    include-before-body: _includes/site-tools.html
